// Requires the client executable with the duelpartner command.
// Execute only on the second client serving as your private sparring partner.
// Loading changes F9/F10 but does not start training. See docs/duel-partner.md.
bind F9 "duelpartner start"
bind F10 "duelpartner stop"
echo "Duel partner: aim at a player's torso, F9 start, F10 stop."
